
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard Expired | QuickShare</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080b18;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 45px 30px;
            text-align: center;
            background: #11162a;
            border: 1px solid #303753;
            border-radius: 22px;
        }

        .icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.12);
            font-size: 34px;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .logo span {
            color: #a78bfa;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #9ca3b8;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        a {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
        }

        footer {
            margin-top: 35px;
            color: #788198;
            font-size: 12px;
            line-height: 2;
        }

        footer span {
            color: #c4b5fd;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">✦ Quick<span>Share.</span></div>

        <div class="icon">⌛</div>

        <h1>Clipboard Expired!</h1>

        <p>
            Sorry, this shared clipboard is no longer available.
            Its expiry time has passed.
        </p>

        <a href="/">+ Create New Clipboard</a>

        <footer>
            Made with ❤️ by <span>Kunal Jolly</span><br>
            © 2026 QuickShare. All Rights Reserved.
        </footer>

    </div>

</body>
</html>
